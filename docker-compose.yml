# ============ docker-compose: sobe TODOS os serviços juntos ============
services:
  # ---------- Banco de dados ----------
  db:
    image: postgres:16-alpine
    container_name: estulanches-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-estulanches}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-estulanches123}
      POSTGRES_DB: ${DB_NAME:-estulanches}
    ports:
      # 5433 no seu PC -> 5432 no container (5432 já é usado pelo seu Postgres local)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data   # dados sobrevivem a "docker compose down"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-estulanches} -d ${DB_NAME:-estulanches}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- Aplicação ----------
  app:
    build: .                              # usa o Dockerfile desta pasta
    image: estulanches:1.0.0
    container_name: estulanches-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy        # só sobe depois que o banco responde
    environment:
      # Dentro da rede do Docker o host do banco é o NOME DO SERVIÇO ("db"), não localhost
      DATABASE_URL: postgresql://${DB_USER:-estulanches}:${DB_PASSWORD:-estulanches123}@db:5432/${DB_NAME:-estulanches}?schema=public
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao}
      NODE_ENV: production
      PORT: 3000
      APP_VERSION: 1.0.0
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@estulanches.com}
      ADMIN_SENHA: ${ADMIN_SENHA:-admin123}
    ports:
      - "3000:3000"                       # porta do seu PC : porta do container
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
